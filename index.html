<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenTrend | ML Market Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen">

    <nav class="border-b border-slate-800 bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-blue-500">TOKEN<span class="text-white">TREND</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">AI-Driven Intelligence</p>
            </div>
            
            <div class="flex items-center gap-4">
                <label for="coinSelect" class="text-xs font-bold text-slate-400 uppercase">Select Asset:</label>
                <select id="coinSelect" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                    <option value="Bitcoin" selected>Bitcoin (BTC)</option>
                    <option value="Ethereum">Ethereum (ETH)</option>
                    <option value="BinanceCoin">Binance Coin (BNB)</option>
                    <option value="Solana">Solana (SOL)</option>
                    <option value="Cardano">Cardano (ADA)</option>
                    <option value="Dogecoin">Dogecoin (DOGE)</option>
                    <option value="XRP">XRP</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-1 bg-slate-800/50 border border-slate-700 p-8 rounded-3xl shadow-2xl flex flex-col items-center justify-center text-center">
                <span class="text-slate-500 text-xs font-bold uppercase tracking-[0.2em] mb-4">Tomorrow's Forecast</span>
                <div id="prediction" class="text-8xl font-black italic tracking-tighter text-slate-700 transition-all duration-500">
                    --
                </div>
                <div id="accuracy-display" class="mt-6 px-4 py-2 bg-blue-500/10 border border-blue-500/20 rounded-full text-blue-400 mono text-sm">
                    Initializing Engine...
                </div>
                <p class="text-slate-500 text-[10px] mt-4 leading-relaxed max-w-[200px]">
                    Prediction based on trained Logistic Regression using OHLCV features.
                </p>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-2xl">
                        <span class="text-slate-500 text-xs font-bold uppercase">Current Price</span>
                        <div id="price" class="text-4xl font-black mono mt-2 text-white">$0.00</div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-2xl">
                        <span class="text-slate-500 text-xs font-bold uppercase">Market Status</span>
                        <div class="flex items-center gap-2 mt-2">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="text-green-400 font-bold text-sm uppercase">Live Data Stream</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-3xl h-[300px]">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>

        <footer class="mt-12 pt-8 border-t border-slate-800 text-center text-slate-500 text-xs">
            <p>&copy; 2026 TokenTrend Analytics. Experimental ML Model. Use for informational purposes only.</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
